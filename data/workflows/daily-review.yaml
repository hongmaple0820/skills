name: "Daily Review Workflow"
description: "每日复盘工作流：收集 Git 提交、代码变更、生成日报"
version: "1.0.0"
entry_point: "start"
tags: ["daily", "review", "automation"]

variables:
  repo_path: "."
  days: 7
  default_mood: 4

triggers:
  - type: scheduled
    cron: "0 21 * * *"  # 每天晚上 9 点执行
  - type: manual

nodes:
  start:
    name: "开始"
    type: sequential
    children:
      - git_stats_node
      - code_analysis_node
      - daily_report_node

  git_stats_node:
    name: "收集 Git 统计"
    type: custom
    metadata:
      handler: git_stats
    inputs:
      repo_path: "{{ variables.repo_path }}"
      days: "{{ variables.days }}"
    outputs:
      commits: "{{ nodes.git_stats_node.output.commits_count }}"
      insertions: "{{ nodes.git_stats_node.output.insertions }}"

  code_analysis_node:
    name: "分析今日代码"
    type: custom
    metadata:
      handler: code_analysis
    inputs:
      file_path: "./src"
      language: python
    condition: "{{ nodes.git_stats_node.output.commits_count > 0 }}"

  daily_report_node:
    name: "生成日报"
    type: custom
    metadata:
      handler: daily_report
    inputs:
      skill_name: "Python Development"
      learning_content: "今日完成 {{ nodes.git_stats_node.output.commits_count }} 次提交，新增 {{ nodes.git_stats_node.output.insertions }} 行代码"
      duration_minutes: 480
      insights:
        - "完成了核心功能开发"
        - "优化了代码结构"
      problems:
        - "需要改进测试覆盖率"
      plans:
        - "明天继续完善功能"
        - "编写单元测试"
      mood: "{{ variables.default_mood }}"

  end:
    name: "结束"
    type: skill_action
    metadata:
      handler: skill_progress
    inputs:
      skill_name: "Python Development"
      action: info
